<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flatplan Designer — Live Workspace</title>
  <!-- Подключаем изолированные стили -->
  <link rel="stylesheet" href="/css/designer.css">
</head>
<body>

  <div id="control_plane">
    <div id="editor_header">
      <span id="title_display">Structure Editor</span>
      <button class="btn_save" id="save_btn">Save (Ctrl+S)</button>
    </div>
    
    <!-- Сюда JS динамически отрендерит дерево блоков -->
    <div id="blocks_tree"></div>
  </div>

  <!-- Главный фрейм превью публикации -->
  <iframe id="preview_plane"></iframe>

  <!-- Подключаем драйвер перетаскивания SortableJS из CDN -->
  <!-- <script src="https://jsdelivr.net"></script> -->
  <script src="http://SortableJS.github.io/Sortable/Sortable.js"></script>
  
  <!-- Подключаем изолированную логику интерфейса -->
  <script src="/js/designer.js"></script>

</body>
</html>
